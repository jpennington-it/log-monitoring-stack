# Promtail tails log files and ships them to Loki with a small set of labels.
#
# Label design: only low-cardinality values (job, host, event, level) become
# labels. High-cardinality values like source IPs, usernames and URLs stay in
# the log line and are extracted at query time with LogQL parsers.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml   # where Promtail remembers how far it has read

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # --- SSH authentication logs (syslog with RFC 3339 timestamps) ---
  - job_name: sshd
    static_configs:
      - targets: [localhost]
        labels:
          job: sshd
          __path__: /var/log/lab/auth.log
    pipeline_stages:
      # 2026-10-08T12:00:01.123456-07:00 lab-web01 sshd[2211]: Failed password for ...
      - regex:
          expression: '^(?P<ts>\S+) (?P<host>\S+) (?P<process>[\w-]+)(?:\[\d+\])?: (?P<message>.*)$'
      - timestamp:
          source: ts
          format: RFC3339Nano
      - labels:
          host:
      # Classify the event into a handful of values so dashboards can filter cheaply.
      - template:
          source: event
          template: >-
            {{ if contains "Failed password" .message }}failed_password{{ else if contains "Accepted" .message }}accepted{{ else if contains "Invalid user" .message }}invalid_user{{ else if contains "Disconnected" .message }}disconnect{{ else }}other{{ end }}
      - labels:
          event:

  # --- Web application logs (one JSON object per line) ---
  - job_name: webapp
    static_configs:
      - targets: [localhost]
        labels:
          job: webapp
          __path__: /var/log/lab/webapp.log
    pipeline_stages:
      - json:
          expressions:
            ts: time
            level: level
            host: host
      - timestamp:
          source: ts
          format: RFC3339Nano
      - labels:
          level:
          host:

  # --- Optional: the Docker host's own logs (uncomment the volume in docker-compose.yml) ---
  # - job_name: host-syslog
  #   static_configs:
  #     - targets: [localhost]
  #       labels:
  #         job: host-syslog
  #         __path__: /var/log/host/{syslog,auth.log}
