# Provisioned on Grafana start-up - no clicking through the UI after a rebuild.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki                    # fixed UID so the dashboard JSON can reference it
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
