apiVersion: 1

providers:
  - name: lab-dashboards
    orgId: 1
    folder: Homelab
    type: file
    disableDeletion: true
    allowUiUpdates: false        # the JSON in git is the source of truth
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
