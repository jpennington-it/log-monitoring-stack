# Homelab log monitoring stack: Loki + Promtail + Grafana (+ Alertmanager for Loki ruler alerts)
#
#   cp .env.example .env    # then set a real Grafana admin password
#   docker compose up -d
#
# All UIs are bound to 127.0.0.1 only. See README.md before exposing anything on a LAN.

name: log-monitoring-stack

networks:
  logging: {}

volumes:
  loki-data: {}
  grafana-data: {}
  alertmanager-data: {}

services:
  loki:
    image: grafana/loki:3.6.11
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    networks: [logging]
    restart: unless-stopped
    # No container healthcheck: the Loki image is distroless (no shell, wget or
    # curl). Check readiness from the host instead: curl localhost:3100/ready

  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./sample-logs:/var/log/lab:ro
      # Uncomment to also ship the Docker host's own logs (Linux hosts only):
      # - /var/log:/var/log/host:ro
    networks: [logging]
    depends_on:
      loki:
        condition: service_started   # Promtail retries pushes until Loki is ready
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [logging]
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [logging]
    restart: unless-stopped

  # Writes synthetic sshd + web app logs into ./sample-logs so the stack has
  # data to show. Disable it (docker compose stop log-generator) once you
  # point Promtail at real logs.
  log-generator:
    image: python:3.12-alpine
    container_name: log-generator
    # Run as your user so the files in ./sample-logs aren't owned by root.
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    command: ["python", "-u", "/app/generate_logs.py", "--output-dir", "/logs", "--rate", "0.5", "--burst-every", "600", "--burst-now"]
    volumes:
      - ./generator:/app:ro
      - ./sample-logs:/logs
    networks: [logging]
    restart: unless-stopped
