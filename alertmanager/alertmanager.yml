# Minimal Alertmanager config for the lab. Alerts are visible in the UI at
# http://localhost:9093 and in Grafana (Alerting > Alert rules / Alertmanager data source).
# Add a real receiver (email, webhook, chat) when you're ready - examples below.
route:
  receiver: lab-default
  group_by: ["alertname", "category"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: lab-default
      repeat_interval: 1h

receivers:
  - name: lab-default
    # Example webhook receiver (placeholder URL):
    # webhook_configs:
    #   - url: http://192.168.56.20:8080/alert-hook
    #
    # Example email receiver (placeholders - keep real credentials out of git):
    # email_configs:
    #   - to: alerts@example.com
    #     from: alertmanager@example.com
    #     smarthost: smtp.example.com:587
    #     auth_username: alertmanager@example.com
    #     auth_password_file: /etc/alertmanager/smtp_password

inhibit_rules:
  # If a single source is already flagged as brute forcing, suppress the generic spike alert.
  - source_matchers: ['alertname="SSHBruteForceSingleSource"']
    target_matchers: ['alertname="SSHFailedLoginSpike"']
    equal: ["category"]
