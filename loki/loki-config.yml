# Single-binary Loki for a homelab: filesystem storage, no multi-tenancy.
# Not sized or hardened for production use.
auth_enabled: false            # single tenant; the tenant ID is "fake"

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h          # keep 7 days - plenty for a lab, keeps disk use small
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_series: 1000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true         # retention is enforced by the compactor
  delete_request_store: filesystem
  compaction_interval: 10m

ruler:
  # Alert rules live in ./loki/rules/<tenant>/*.yml (tenant is "fake" with auth disabled).
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  enable_alertmanager_v2: true
  evaluation_interval: 1m

analytics:
  reporting_enabled: false
